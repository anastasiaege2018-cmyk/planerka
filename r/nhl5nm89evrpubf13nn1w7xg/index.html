<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Планёрки · Циан</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f9fc;display:flex;flex-direction:column;height:100vh;height:100dvh}
.bar{flex:0 0 auto;background:#fff;border-bottom:1px solid #e5e7eb;padding:8px 12px;display:flex;gap:8px;align-items:center;overflow-x:auto;-webkit-overflow-scrolling:touch}
.grp{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.grp+.grp{margin-left:6px;padding-left:12px;border-left:1px solid #eef0f4}
.lbl{font-size:10px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap;margin-right:2px}
.wb{flex:0 0 auto;border:1px solid #e5e7eb;background:#fff;color:#475569;font-size:13px;font-weight:600;padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:.15s}
.wb small{display:block;font-size:10px;font-weight:500;color:#94a3b8;margin-top:1px}
.wb.active{background:#6366f1;border-color:#6366f1;color:#fff}
.wb.active small{color:#e0e7ff}
.wb.calls.active{background:#059669;border-color:#059669}
.wb.calls.active small{color:#d1fae5}
.frm{flex:1 1 auto;position:relative}
.frm iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f8f9fc}
.frm iframe.hidden{display:none}
</style></head><body>
<div class="bar">
  <div class="grp">
    <span class="lbl">Неделя</span>
    <button class="wb active" data-f="cur"   onclick="show(this)">03.08 – 09.08 <small>текущая</small></button>
    <button class="wb"        data-f="p1"    onclick="show(this)">27.07 – 02.08</button>
    <button class="wb"        data-f="p2"    onclick="show(this)">20.07 – 26.07</button>
  </div>
  <div class="grp">
    <span class="lbl">Звонки</span>
    <button class="wb calls"  data-f="calls"  onclick="show(this)">📞 03.08 – 09.08 <small>текущая</small></button>
    <button class="wb calls"  data-f="calls1" onclick="show(this)">📞 27.07 – 02.08</button>
  </div>
</div>
<div class="frm">
  <iframe id="f-cur"   src="w-0308-0908.html"     title="Планёрка 03.08–09.08"></iframe>
  <iframe id="f-p1"    class="hidden" data-lazy="w-2707-0208.html"  title="Планёрка 27.07–02.08"></iframe>
  <iframe id="f-p2"    class="hidden" data-lazy="w-2007-2607.html"  title="Планёрка 20.07–26.07"></iframe>
  <iframe id="f-calls"  class="hidden" data-lazy="calls-0308-0908.html" title="Звонки 03.08–09.08"></iframe>
  <iframe id="f-calls1" class="hidden" data-lazy="calls-2707-0208.html" title="Звонки 27.07–02.08"></iframe>
</div>
<script>
function show(btn){
  var f=btn.getAttribute('data-f');
  document.querySelectorAll('.frm iframe').forEach(function(fr){
    var on=fr.id==='f-'+f;
    if(on && !fr.src && fr.dataset.lazy){fr.src=fr.dataset.lazy;}   // load on first open
    fr.classList.toggle('hidden',!on);
  });
  document.querySelectorAll('.bar .wb').forEach(function(b){b.classList.toggle('active',b===btn);});
}
</script>
</body></html>
