<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="robots" content="noindex, nofollow, noarchive, nosnippet"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Планёрки · Циан</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f8f9fc;display:flex;flex-direction:column;height:100vh;height:100dvh}
.wk{flex:0 0 auto;background:#fff;border-bottom:1px solid #e5e7eb;padding:8px 12px;display:flex;gap:8px;align-items:center;overflow-x:auto}
.wk .lbl{font-size:10px;font-weight:700;color:#6366f1;text-transform:uppercase;letter-spacing:.08em;margin-right:2px;white-space:nowrap}
.wb{flex:0 0 auto;border:1px solid #e5e7eb;background:#fff;color:#475569;font-size:13px;font-weight:600;padding:8px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;-webkit-tap-highlight-color:transparent;transition:.15s}
.wb small{display:block;font-size:10px;font-weight:500;color:#94a3b8;margin-top:1px}
.wb.active{background:#6366f1;border-color:#6366f1;color:#fff}
.wb.active small{color:#e0e7ff}
.frm{flex:1 1 auto;position:relative}
.frm iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#f8f9fc}
.frm iframe.hidden{display:none}
</style></head><body>
<div class="wk">
  <span class="lbl">Неделя</span>
  <button class="wb active" id="b-cur" onclick="show('cur')">27.07 – 02.08 <small>текущая</small></button>
  <button class="wb" id="b-prev" onclick="show('prev')">20.07 – 26.07 <small>прошлая</small></button>
</div>
<div class="frm">
  <iframe id="f-cur"  src="w-2707-0208.html" title="Отчёт 27.07–02.08"></iframe>
  <iframe id="f-prev" class="hidden" src="w-2007-2607.html" title="Отчёт 20.07–26.07"></iframe>
</div>
<script>
function show(w){
  var cur=w==='cur';
  document.getElementById('f-cur').classList.toggle('hidden',!cur);
  document.getElementById('f-prev').classList.toggle('hidden',cur);
  document.getElementById('b-cur').classList.toggle('active',cur);
  document.getElementById('b-prev').classList.toggle('active',!cur);
}
</script>
</body></html>
